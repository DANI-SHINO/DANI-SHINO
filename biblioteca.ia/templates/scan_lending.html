{% extends "layout.html" %}
{% block title %}Préstamo/Devolución por Escaneo{% endblock %}
{% block content %}
<h2>Escanear Ejemplar para Préstamo o Devolución</h2>

<div id="interactive" class="viewport"></div>

<div style="margin-top: 20px;">
    <h3>Resultado:</h3>
    <p id="codigo-escaneado">Esperando ejemplar...</p>
    <p id="estado-resultado">-</p>
    <button id="reiniciar" class="btn" style="display: none;">Escanear Otro</button>
</div>

<script src="{{ url_for('static', filename='js/quagga.min.js') }}"></script>
<script>
    const codigoElem = document.getElementById('codigo-escaneado');
    const estadoElem = document.getElementById('estado-resultado');
    const reiniciarBtn = document.getElementById('reiniciar');

    function startScanner() {
        codigoElem.textContent = 'Esperando ejemplar...';
        estadoElem.textContent = '-';
        estadoElem.style.color = 'black';
        reiniciarBtn.style.display = 'none';

        Quagga.init({
            inputStream : {
                name : "Live",
                type : "LiveStream",
                target: document.querySelector('#interactive'),
                constraints: { facingMode: "environment" }
            },
            decoder : {
                readers : ["code_128_reader", "ean_reader"]
            },
            locate: true
        }, function(err) {
            if (err) {
                codigoElem.textContent = 'Error al iniciar cámara';
                return;
            }
            Quagga.start();
        });

        Quagga.onDetected(function(result) {
            Quagga.stop();
            const codigo = result.codeResult.code;
            codigoElem.textContent = `Código Escaneado: ${codigo}`;
            estadoElem.textContent = 'Procesando...';

            fetch("/api/ejemplar/escanear", {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ codigo: codigo })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    estadoElem.textContent = `${data.message} → ${data.titulo}`;
                    estadoElem.style.color = data.estado_nuevo === 'disponible' ? 'green' : 'red';
                } else {
                    estadoElem.textContent = `Error: ${data.message}`;
                    estadoElem.style.color = 'orange';
                }
                reiniciarBtn.style.display = 'inline-block';
            });
        });
    }

    window.onload = startScanner;
    reiniciarBtn.onclick = startScanner;
</script>

<style>
    #interactive {
        width: 100%;
        height: 400px;
        border: 1px solid #ccc;
        margin-bottom: 20px;
    }
</style>
{% endblock %}
