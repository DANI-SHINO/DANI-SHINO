<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Configuración de Perfil - Biblioteca</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background-color: #0a0a23;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-box {
            background-color: #1a1a40;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 500px;
        }

        label {
            text-align: left;
            display: block;
        }

        img.profile-pic {
            border-radius: 50%;
            border: 2px solid #61dafb;
        }

        .btn-success {
            background-color: #28a745;
            border: none;
        }

        .btn-success:hover {
            background-color: #218838;
        }

        a {
            color: #61dafb;
        }

        a:hover {
            color: #39c2f7;
        }
    </style>
</head>
<body>
    <div class="profile-box text-center">
        <img src="{{ url_for('static', filename='imagenes/logofinal.png') }}" alt="Logo Biblioteca" width="80" class="mb-3">
        <h2 class="mb-4">Editar perfil</h2>

        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3 text-start">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" class="form-control" value="{{ usuario.nombre }}" required>
            </div>

            <div class="mb-3 text-start">
                <label for="correo">Correo:</label>
                <input type="email" id="correo" name="correo" class="form-control" value="{{ usuario.correo }}" required>
            </div>

            <div class="mb-3 text-start">
                <label for="foto_perfil">Foto de perfil:</label><br>
                <img src="{{ url_for('main.foto_perfil') }}" width="80" class="profile-pic mb-2">
                <input type="file" id="foto_perfil" name="foto_perfil" class="form-control">
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-success w-100">Guardar cambios</button>
            </div>
        </form>
    </div>
</body>
</html>
